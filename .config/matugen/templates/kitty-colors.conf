# The 16 ANSI terminal colors
# black / bright black
color0  {{colors.surface_container_low.dark.hex}}
color8  {{colors.outline_variant.dark.hex}}

# red / bright red → error tones
color1  {{colors.error.dark.hex}}
color9  {{colors.on_error_container.dark.hex}}

# green / bright green → secondary (the wallpaper's second hue)
color2  {{colors.secondary.dark.hex}}
color10 {{colors.secondary_fixed.dark.hex}}

# yellow / bright yellow → tertiary (warm accent)
color3  {{colors.tertiary.dark.hex}}
color11 {{colors.tertiary_fixed.dark.hex}}

# blue / bright blue → primary (the main wallpaper accent)
color4  {{colors.primary.dark.hex}}
color12 {{colors.primary_fixed.dark.hex}}

# magenta / bright magenta → inverse_primary (complementary hue)
color5  {{colors.inverse_primary.dark.hex}}
color13 {{colors.primary_container.dark.hex}}

# cyan / bright cyan → secondary_fixed tones
color6  {{colors.secondary_fixed_dim.dark.hex}}
color14 {{colors.secondary_fixed.dark.hex}}

# white / bright white → on_surface tones (readable text shades)
color7  {{colors.on_surface_variant.dark.hex}}
color15 {{colors.on_surface.dark.hex}}