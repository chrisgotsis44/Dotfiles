# The 16 ANSI terminal colors
# black / bright black
color0  #25181d
color8  #534248

# red / bright red → error tones
color1  #ffb4ab
color9  #ffdad6

# green / bright green → secondary (the wallpaper's second hue)
color2  #f2b7c1
color10 #ffd9de

# yellow / bright yellow → tertiary (warm accent)
color3  #ffb3b0
color11 #ffdad8

# blue / bright blue → primary (the main wallpaper accent)
color4  #ffb0cf
color12 #ffd9e5

# magenta / bright magenta → inverse_primary (complementary hue)
color5  #b70071
color13 #8c0055

# cyan / bright cyan → secondary_fixed tones
color6  #f2b7c1
color14 #ffd9de

# white / bright white → on_surface tones (readable text shades)
color7  #d8c1c7
color15 #f5dce3