general {
    lock_cmd = lock.sh                          # standalone quickshell locker; flocks against double-launch.
    before_sleep_cmd = loginctl lock-session    # lock before suspend.
    after_sleep_cmd = hyprctl dispatch dpms on  # to avoid having to press a key twice to turn on the display.
}

listener {
    timeout = 150                                # 2.5min.
    on-timeout = brightnessctl -s set 10         # set monitor backlight to minimum, avoid 0 on OLED monitor.
    on-resume = brightnessctl -r                 # monitor backlight restore.
}

listener {
    timeout = 300                                # 5min - lock screen when timeout has passed
    on-timeout = lock.sh
}

listener {
    timeout = 600                                # 10min - screen off AFTER the locker has had time to fully initialize
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on && brightnessctl -r  # screen on when activity is detected after timeout has fired.
}

listener {
    timeout = 1800                               # 30min
    on-timeout = systemctl suspend               # suspend pc
}
