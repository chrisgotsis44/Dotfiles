#############
### INPUT ###
#############

input {
    kb_layout = us,gr
    numlock_by_default = true
    repeat_delay = 250
    repeat_rate = 35
    kb_options = grp:alt_shift_toggle

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = true
    }
}

device {
    #name = epic-mouse-v1
    #sensitivity = -0.5
}

